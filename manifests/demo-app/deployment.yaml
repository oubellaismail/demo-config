# Delivery manifest for a paved-road service, generated by onboard.sh.
#
# The image is the SIGNED digest in the production registry (DOCR) — the only
# registry the cluster pulls from — so it is admitted by the signature +
# trusted-registry policies. demo-app is the FULL service repo name under the
# <project>-<service> convention (e.g. demo-app), which is exactly what the
# release pipeline promotes as the image name and derives the config path from
# (registry.digitalocean.com/sddp-registry/demo-app, manifests/demo-app/). The pod
# is non-root with a RuntimeDefault seccomp profile, drops all capabilities, and
# forbids privilege escalation; it stays in the small resource tier. The
# namespace's default-deny NetworkPolicy plus this service's own allow-rules
# (cnp.yaml) govern its network reach.
#
# The image is pinned by digest — this is exactly the line the service's release
# pipeline bumps on each new signed release. No imagePullSecret: the cluster's
# registry integration injects pull creds into every namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
  labels:
    app: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-app
          image: registry.digitalocean.com/sddp-registry/demo-app@sha256:e59816cbaa271896155457bee7695666adb7cd2a0acb71801277bb04306dc033
          ports:
            - name: http
              containerPort: 3000
          env:
            # The app reports its own name (see the template's server.js). Not a
            # secret — a plain label — so it is inline, not a secretKeyRef.
            - name: SERVICE_NAME
              value: demo-app
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
